<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>심방신청</title>
<meta name="theme-color" content="#781423">
<link rel="icon" href="data:,">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
    :root {
        --bg: #fffaf5;
        --ink: #2b1e2a;
        --ink-sub: #8d7e8a;
        --card: rgba(255,255,255,0.92);
        --card-solid: #ffffff;
        --line: rgba(255,90,122,0.14);
        --wash: rgba(255,90,122,0.07);
        --brand: #ff5a7a;
        --brand2: #ff8a5c;
        --accent: #7c6cf0;
        --open: #06b88a;
        --open-wash: rgba(6,184,138,0.14);
        --radius: 26px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; color-scheme: light; }
    body {
        margin: 0;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }

    .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.5; z-index: 0; pointer-events: none; }
    .blob-1 { width: 340px; height: 340px; top: -120px; left: -100px; background: radial-gradient(circle, var(--brand2), transparent 70%); animation: float1 16s ease-in-out infinite; }
    .blob-2 { width: 300px; height: 300px; bottom: -100px; right: -80px; background: radial-gradient(circle, var(--accent), transparent 70%); animation: float2 20s ease-in-out infinite; }
    @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,40px) scale(1.1); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-25px,-30px) scale(1.08); } }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: 40px 16px 60px; }

    .header { text-align: center; margin-bottom: 20px; }
    .header .badge {
        display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800;
        color: var(--brand); background: var(--wash); border: 1px solid var(--line);
        padding: 6px 14px; border-radius: 999px; margin-bottom: 14px;
    }
    .header h1 { font-size: 27px; font-weight: 900; margin: 0 0 8px; line-height: 1.3; letter-spacing: -0.02em; }
    .header h1 .grad {
        background: linear-gradient(100deg, var(--brand), var(--brand2) 60%, var(--accent));
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .header p { font-size: 13.5px; color: var(--ink-sub); margin: 0; line-height: 1.7; font-weight: 500; }

    .card {
        background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--line); border-radius: var(--radius);
        padding: 22px 18px 22px; margin-bottom: 14px;
        box-shadow: 0 20px 50px -15px rgba(120,20,35,0.18);
    }
    .card-title { font-size: 15px; font-weight: 900; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
    .card-sub { font-size: 12px; color: var(--ink-sub); font-weight: 600; margin: 0 0 16px; }

    /* ---- 주간 그리드 피커 ---- */
    .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .week-nav button {
        width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--wash);
        color: var(--brand); font-weight: 900; font-size: 15px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
    }
    .week-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
    .week-nav .range { font-size: 12.5px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }

    .legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--ink-sub); font-weight: 700; margin-bottom: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    .grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -18px; padding: 0 18px; }
    .slot-grid { display: grid; grid-template-columns: 38px repeat(7, minmax(38px, 1fr)); gap: 4px; min-width: 460px; }
    .slot-grid .day-head { text-align: center; padding-bottom: 4px; }
    .slot-grid .day-head .d { font-size: 10.5px; font-weight: 900; color: var(--ink-sub); }
    .slot-grid .day-head .n { font-size: 9.5px; font-weight: 700; color: var(--ink-sub); font-variant-numeric: tabular-nums; }
    .slot-grid .day-head.today .d, .slot-grid .day-head.today .n { color: var(--brand); }
    .slot-grid .hour-label {
        font-size: 9px; font-weight: 800; color: var(--ink-sub); display: flex; align-items: center;
        justify-content: flex-end; padding-right: 3px; font-variant-numeric: tabular-nums;
    }
    .slot-cell {
        height: 30px; border-radius: 8px; cursor: pointer; transition: transform 0.1s ease, background 0.15s ease;
        background: var(--open-wash);
    }
    .slot-cell:active { transform: scale(0.9); }
    .slot-cell.closed { background: var(--wash); cursor: default; opacity: 0.5; }
    .slot-cell.taken { background: var(--line); cursor: default; opacity: 0.6; }
    .slot-cell.past { background: transparent; cursor: default; }
    .slot-cell.selected { background: linear-gradient(135deg, var(--brand), var(--brand2)); box-shadow: 0 4px 14px -4px rgba(120,20,35,0.5); }

    .selected-summary {
        display: none; align-items: center; gap: 8px; margin-top: 14px; padding: 12px 14px;
        background: var(--open-wash); border: 1px solid var(--open); border-radius: 14px;
        font-size: 13px; font-weight: 800; color: var(--ink);
    }
    .selected-summary.show { display: flex; }

    .field { margin-bottom: 16px; }
    .field:last-of-type { margin-bottom: 0; }
    .field-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; margin-bottom: 8px; }
    .field-label .req { color: var(--brand2); }
    .field-label .opt { font-weight: 600; color: var(--ink-sub); font-size: 11px; }

    .input-shell { position: relative; }
    .input-shell .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: 0.8; pointer-events: none; }
    input[type="text"], input[type="tel"], textarea {
        width: 100%; padding: 13px 13px 13px 40px; font-size: 15px; font-weight: 600;
        border-radius: 15px; border: 1.5px solid var(--line); background: var(--wash); color: var(--ink);
        font-family: inherit; outline: none; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    input::placeholder, textarea::placeholder { color: var(--ink-sub); font-weight: 500; opacity: 0.75; }
    input:focus, textarea:focus { border-color: var(--brand2); background: var(--card-solid); box-shadow: 0 0 0 4px rgba(201,69,95,0.12); }
    input.valid { border-color: #4fb477; }
    textarea { padding-left: 13px; resize: none; min-height: 80px; line-height: 1.6; }
    .charcount { text-align: right; font-size: 10.5px; color: var(--ink-sub); font-weight: 700; margin-top: 5px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
        padding: 9px 15px; font-size: 12.5px; font-weight: 700; border-radius: 999px;
        border: 1.5px solid var(--line); background: var(--wash); color: var(--ink-sub);
        cursor: pointer; transition: all 0.15s ease; white-space: nowrap; -webkit-user-select: none; user-select: none;
    }
    .chip:active { transform: scale(0.95); }
    .chip.selected {
        background: linear-gradient(100deg, var(--brand), var(--brand2)); border-color: transparent; color: #fff;
        box-shadow: 0 6px 16px -6px rgba(120,20,35,0.5);
    }

    .error {
        font-size: 12.5px; color: var(--brand2); font-weight: 700; margin-top: 14px;
        padding: 10px 14px; background: var(--wash); border-radius: 12px; display: none;
    }

    button[type="submit"] {
        width: 100%; margin-top: 4px; padding: 17px; font-size: 16px; font-weight: 900;
        border: none; border-radius: 18px; color: #fff; cursor: pointer;
        background: linear-gradient(100deg, var(--brand), var(--brand2));
        box-shadow: 0 14px 30px -10px rgba(120,20,35,0.45);
        transition: transform 0.15s ease, opacity 0.2s;
        display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button[type="submit"]:active { transform: scale(0.97); }
    button[type="submit"]:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: #fff; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .privacy { font-size: 11px; color: var(--ink-sub); text-align: center; margin-top: 14px; line-height: 1.7; font-weight: 500; }

    #success { display: none; text-align: center; padding: 50px 24px 36px; }
    .check-circle {
        width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px;
        background: linear-gradient(135deg, var(--brand), var(--brand2));
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 16px 36px -10px rgba(120,20,35,0.5);
        animation: pop 0.5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .check-circle svg { width: 38px; height: 38px; }
    .check-circle path {
        fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 0.4s ease 0.35s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    #success h2 { font-size: 20px; font-weight: 900; margin: 0 0 8px; }
    #success .slot-recap { font-size: 13px; font-weight: 800; color: var(--brand); margin: 0 0 12px; }
    #success p { font-size: 13.5px; color: var(--ink-sub); line-height: 1.8; margin: 0 0 24px; font-weight: 500; }
    #success button {
        padding: 12px 24px; font-size: 13.5px; font-weight: 800; border-radius: 14px;
        border: 1.5px solid var(--line); background: var(--wash); color: var(--brand); cursor: pointer;
    }

    .fade-in { animation: fadeIn 0.5s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="wrap">
    <div class="header fade-in">
        <span class="badge">✨ 청년부 심방신청</span>
        <h1>편하게<br><span class="grad">마음 나눠요</span></h1>
        <p>달력에서 편한 시간을 고르고<br>정보만 남겨주시면 끝! 🕊️</p>
    </div>

    <div id="form-flow">
        <div class="card fade-in" style="animation-delay:0.05s">
            <p class="card-title">🗓️ 언제가 편하세요?</p>
            <p class="card-sub">초록 칸을 눌러 시간을 골라주세요</p>

            <div class="week-nav">
                <button id="week-prev" onclick="shiftWeek(-1)">‹</button>
                <span class="range" id="week-range"></span>
                <button id="week-next" onclick="shiftWeek(1)">›</button>
            </div>
            <div class="legend">
                <span><i style="background:var(--open-wash);"></i>선택 가능</span>
                <span><i style="background:var(--line);"></i>마감</span>
            </div>
            <div class="grid-scroll">
                <div class="slot-grid" id="slot-grid"></div>
            </div>
            <div class="selected-summary" id="selected-summary">
                ✅ <span id="selected-summary-text"></span>
            </div>
        </div>

        <div class="card fade-in" style="animation-delay:0.1s">
            <p class="card-title">✏️ 정보를 남겨주세요</p>
            <form id="visit-form" novalidate>
                <div class="field">
                    <label class="field-label">이름 <span class="req">*</span></label>
                    <div class="input-shell">
                        <span class="ico">👤</span>
                        <input type="text" id="f-name" placeholder="이름을 입력해주세요" autocomplete="name">
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">연락처 <span class="req">*</span></label>
                    <div class="input-shell">
                        <span class="ico">📱</span>
                        <input type="tel" id="f-phone" placeholder="010-0000-0000" autocomplete="tel" inputmode="numeric" maxlength="13">
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">소속 <span class="opt">선택</span></label>
                    <div class="chips" id="chips-group">
                        <div class="chip" data-value="청년교구">청년교구</div>
                        <div class="chip" data-value="청년금요기도회">청년금요기도회</div>
                        <div class="chip" data-value="1청2팀">1청2팀</div>
                        <div class="chip" data-value="수련회">수련회</div>
                        <div class="chip" data-value="기타">기타</div>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">나누고 싶은 이야기 <span class="opt">선택</span></label>
                    <textarea id="f-reason" maxlength="300" placeholder="요즘 고민, 나누고 싶은 이야기를 편하게 적어주세요"></textarea>
                    <div class="charcount"><span id="char-count">0</span>/300</div>
                </div>

                <div class="error" id="form-error"></div>
                <button type="submit" id="submit-btn">
                    <span class="spinner" id="spinner"></span>
                    <span id="submit-text">신청하기 →</span>
                </button>
                <p class="privacy">입력하신 정보는 심방 연락을 위해서만 사용되며,<br>담당 목사님에게만 전달됩니다.</p>
            </form>
        </div>
    </div>

    <div class="card" id="success">
        <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></div>
        <h2>신청이 접수됐어요!</h2>
        <p class="slot-recap" id="success-slot"></p>
        <p>소중한 마음 감사해요.<br>확인 후 빠르게 연락드릴게요 💌</p>
        <button onclick="location.reload()">다시 신청하기</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAI5ZHYd_Mi7JogsgZAYsBERsbPMD5m544",
        authDomain: "wwjd-hub.firebaseapp.com",
        projectId: "wwjd-hub",
        storageBucket: "wwjd-hub.firebasestorage.app",
        messagingSenderId: "518785715153",
        appId: "1:518785715153:web:2fd76cfe4a1aabd6bd2ef0",
        measurementId: "G-FCN8CSHR7Y"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
    const DAY_LABELS = { mon:'월', tue:'화', wed:'수', thu:'목', fri:'금', sat:'토', sun:'일' };
    const MAX_WEEKS_AHEAD = 3; // 이번주 포함 총 4주까지 예약 가능

    let availability = { startHour: 9, endHour: 21, available: { mon:[],tue:[],wed:[],thu:[],fri:[],sat:[],sun:[] } };
    let weekOffset = 0;
    let takenSlots = {}; // "YYYY-MM-DD_H" -> true
    let selectedSlot = null; // { dateStr, hour }

    function getWeekDates(offset) {
        const now = new Date();
        const mondayOffset = now.getDay() === 0 ? -6 : 1 - now.getDay();
        const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset + offset * 7);
        const todayStr = now.toDateString();
        return DAY_KEYS.map((key, i) => {
            const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            return { key, dateObj: d, dateStr, label: `${d.getMonth()+1}.${d.getDate()}`, isToday: d.toDateString() === todayStr, isPast: d < new Date(now.getFullYear(), now.getMonth(), now.getDate()) };
        });
    }

    function loadAvailability() {
        return db.collection('visit_settings').doc('availability').get().then(doc => {
            if (doc.exists) {
                const d = doc.data();
                availability = {
                    startHour: d.startHour || 9,
                    endHour: d.endHour || 21,
                    available: Object.assign({ mon:[],tue:[],wed:[],thu:[],fri:[],sat:[],sun:[] }, d.available || {})
                };
            }
        }).catch(err => console.warn('가능시간 로드 실패:', err));
    }

    function loadTakenSlots(days) {
        const startDate = days[0].dateStr;
        const endDate = days[6].dateStr;
        return db.collection('visit_slots')
            .where('date', '>=', startDate).where('date', '<=', endDate)
            .get().then(snap => {
                takenSlots = {};
                snap.forEach(doc => {
                    const d = doc.data();
                    takenSlots[d.date + '_' + parseInt(d.time)] = true;
                });
            }).catch(err => console.warn('예약 현황 로드 실패:', err));
    }

    function renderGrid() {
        const days = getWeekDates(weekOffset);
        document.getElementById('week-range').textContent = `${days[0].label} ~ ${days[6].label}`;
        document.getElementById('week-prev').disabled = (weekOffset <= 0);
        document.getElementById('week-next').disabled = (weekOffset >= MAX_WEEKS_AHEAD);

        const hours = [];
        for (let h = availability.startHour; h < availability.endHour; h++) hours.push(h);

        const now = new Date();
        let html = '<div></div>' + days.map(d => `<div class="day-head ${d.isToday ? 'today' : ''}"><div class="d">${DAY_LABELS[d.key]}</div><div class="n">${d.label}</div></div>`).join('');

        hours.forEach(h => {
            html += `<div class="hour-label">${h}시</div>`;
            days.forEach(d => {
                const openByTemplate = (availability.available[d.key] || []).includes(h);
                const slotDateTime = new Date(d.dateObj.getFullYear(), d.dateObj.getMonth(), d.dateObj.getDate(), h, 0);
                const isPast = slotDateTime < now;
                const taken = !!takenSlots[d.dateStr + '_' + h];
                const isSelected = selectedSlot && selectedSlot.dateStr === d.dateStr && selectedSlot.hour === h;

                let cls = 'slot-cell';
                let onclick = '';
                if (isPast) cls += ' past';
                else if (taken) cls += ' taken';
                else if (!openByTemplate) cls += ' closed';
                else {
                    onclick = `onclick="selectSlot('${d.dateStr}', ${h})"`;
                    if (isSelected) cls += ' selected';
                }
                html += `<div class="${cls}" ${onclick}></div>`;
            });
        });

        document.getElementById('slot-grid').innerHTML = html;
    }

    function selectSlot(dateStr, hour) {
        selectedSlot = { dateStr, hour };
        renderGrid();
        const d = new Date(dateStr + 'T00:00:00');
        const dayLabel = DAY_LABELS[DAY_KEYS[(d.getDay() + 6) % 7]];
        const text = `${d.getMonth()+1}월 ${d.getDate()}일(${dayLabel}) ${hour}시로 선택했어요`;
        document.getElementById('selected-summary-text').textContent = text;
        document.getElementById('selected-summary').classList.add('show');
    }

    function shiftWeek(delta) {
        const next = weekOffset + delta;
        if (next < 0 || next > MAX_WEEKS_AHEAD) return;
        weekOffset = next;
        loadTakenSlots(getWeekDates(weekOffset)).then(renderGrid);
    }

    /* 소속 칩 */
    let selectedGroup = '';
    document.getElementById('chips-group').querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const already = chip.classList.contains('selected');
            document.querySelectorAll('#chips-group .chip').forEach(c => c.classList.remove('selected'));
            if (!already) { chip.classList.add('selected'); selectedGroup = chip.dataset.value; }
            else selectedGroup = '';
        });
    });

    const nameInput = document.getElementById('f-name');
    const phoneInput = document.getElementById('f-phone');
    const reasonInput = document.getElementById('f-reason');
    const charCount = document.getElementById('char-count');

    phoneInput.addEventListener('input', () => {
        let digits = phoneInput.value.replace(/\D/g, '').slice(0, 11);
        let formatted = digits;
        if (digits.length > 3 && digits.length <= 7) formatted = digits.slice(0,3) + '-' + digits.slice(3);
        else if (digits.length > 7) formatted = digits.slice(0,3) + '-' + digits.slice(3,7) + '-' + digits.slice(7);
        phoneInput.value = formatted;
        phoneInput.classList.toggle('valid', digits.length >= 9);
    });
    nameInput.addEventListener('input', () => nameInput.classList.toggle('valid', !!nameInput.value.trim()));
    reasonInput.addEventListener('input', () => charCount.textContent = reasonInput.value.length);

    const form = document.getElementById('visit-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');
    const spinner = document.getElementById('spinner');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();

        if (!selectedSlot) {
            errorEl.textContent = '먼저 달력에서 시간을 골라주세요.';
            errorEl.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
        }
        if (!name || phone.replace(/\D/g, '').length < 9) {
            errorEl.textContent = '이름과 연락처를 입력해주세요.';
            errorEl.style.display = 'block';
            return;
        }
        errorEl.style.display = 'none';

        submitBtn.disabled = true;
        submitText.textContent = '접수 중...';
        spinner.style.display = 'inline-block';

        const slotTime = String(selectedSlot.hour).padStart(2, '0') + ':00';
        const slotId = selectedSlot.dateStr + '_' + slotTime;
        const slotRef = db.collection('visit_slots').doc(slotId);
        const requestRef = db.collection('visit_requests').doc();

        db.runTransaction(function(tx) {
            return tx.get(slotRef).then(function(slotDoc) {
                if (slotDoc.exists) throw new Error('SLOT_TAKEN');
                tx.set(slotRef, { date: selectedSlot.dateStr, time: slotTime, requestId: requestRef.id });
                tx.set(requestRef, {
                    name: name,
                    phone: phone,
                    group: selectedGroup,
                    reason: reasonInput.value.trim(),
                    slotDate: selectedSlot.dateStr,
                    slotTime: slotTime,
                    status: '신규',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
        }).then(function() {
            const d = new Date(selectedSlot.dateStr + 'T00:00:00');
            const dayLabel = DAY_LABELS[DAY_KEYS[(d.getDay() + 6) % 7]];
            document.getElementById('success-slot').textContent = `${d.getMonth()+1}월 ${d.getDate()}일(${dayLabel}) ${selectedSlot.hour}시`;
            document.getElementById('form-flow').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        }).catch(function(err) {
            console.error(err);
            if (err && err.message === 'SLOT_TAKEN') {
                errorEl.textContent = '앗, 방금 다른 분이 먼저 신청했어요! 다른 시간을 골라주세요.';
                selectedSlot = null;
                document.getElementById('selected-summary').classList.remove('show');
                loadTakenSlots(getWeekDates(weekOffset)).then(renderGrid);
            } else {
                errorEl.textContent = '접수 중 문제가 발생했어요. 잠시 후 다시 시도해주세요.';
            }
            errorEl.style.display = 'block';
            submitBtn.disabled = false;
            submitText.textContent = '신청하기 →';
            spinner.style.display = 'none';
        });
    });

    /* 초기 로드 */
    Promise.all([loadAvailability(), loadTakenSlots(getWeekDates(weekOffset))]).then(renderGrid);
</script>
</body>
</html>
